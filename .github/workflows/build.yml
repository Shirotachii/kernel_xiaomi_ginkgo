name: build kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set Timezone
        run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
      
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
         sudo apt-get update
         sudo apt-get install -y \
         build-essential make gcc g++ bc bison flex perl \
         libssl-dev libelf-dev libfl-dev libncurses-dev \
         curl wget git ccache python3 \
         zip unzip tar gzip bzip2 lz4 zstd \
         clang llvm lld device-tree-compiler

      - name: Build Kernel with KSU
        run: bash build.sh -k

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-ksun
          path: Kirito-AOSP-Ginkgo-KSUNext*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
