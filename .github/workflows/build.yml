name: build kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set Timezone
        run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
      
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex perl \
            libssl-dev libelf-dev libfl-dev libncursesw5-dev \
            aria2 curl wget git ccache python3 python3-pip \
            zip unzip tar gzip bzip2 lz4 zstd clang llvm \
            device-tree-compiler libarchive-tools ca-certificates

      - name: Build Kernel with KSU
        run: bash build.sh --ksu

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-ksu
          path: Kirito-AOSP-Ginkgo-KSUNext*.zip
          if-no-files-found: error
          retention-days: 30
